[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dualarrow-rag"
version = "0.1.0"
description = "Evidence-first adaptive RAG framework with hybrid retrieval and claim-level verification"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "DualArrow Contributors"}]
keywords = ["rag", "retrieval", "llm", "graphrag", "hybrid-search", "anti-hallucination"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=2,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "PyYAML>=6,<7",
  "rich>=13.9,<16",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
local-ml = [
  "sentence-transformers>=3.3,<6",
]
postgres = [
  "SQLAlchemy[asyncio]>=2.0,<2.2",
  "asyncpg>=0.30,<1",
  "pgvector>=0.3,<1",
]
qdrant = ["qdrant-client>=1.12,<2"]
opensearch = ["opensearch-py>=2.8,<4", "aiohttp>=3.10,<4"]
neo4j = ["neo4j>=6,<7"]
graphdb = ["rdflib>=7,<8"]
all-adapters = [
  "SQLAlchemy[asyncio]>=2.0,<2.2",
  "asyncpg>=0.30,<1",
  "pgvector>=0.3,<1",
  "qdrant-client>=1.12,<2",
  "opensearch-py>=2.8,<4",
  "aiohttp>=3.10,<4",
  "neo4j>=6,<7",
  "rdflib>=7,<8",
]
dev = [
  "coverage[toml]>=7.6,<8",
  "mypy>=1.13,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.8,<1",
]

[project.scripts]
dualarrow = "dualarrow.cli:app"

[project.urls]
Homepage = "https://github.com/your-org/dualarrow"
Documentation = "https://github.com/your-org/dualarrow/tree/main/docs"
Issues = "https://github.com/your-org/dualarrow/issues"

[tool.setuptools.packages.find]
include = ["dualarrow*"]

[tool.setuptools.package-data]
dualarrow = ["templates/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["dualarrow", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
branch = true
source = ["dualarrow"]
omit = [
  "dualarrow/cli.py",
  "dualarrow/stores/qdrant.py",
  "dualarrow/stores/pgvector.py",
  "dualarrow/stores/opensearch.py",
  "dualarrow/stores/neo4j.py",
  "dualarrow/stores/graphdb.py",
  "dualarrow/embeddings/openai_compatible.py",
  "dualarrow/embeddings/sentence_transformer.py",
  "dualarrow/generation/openai_compatible.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 65

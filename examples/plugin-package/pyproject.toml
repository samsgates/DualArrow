[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dualarrow-example-plugin"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["dualarrow-rag>=0.1.0"]

[project.entry-points."dualarrow.ingestion_views"]
first_paragraph = "dualarrow_example_plugin:first_paragraph_view"

[project.entry-points."dualarrow.retrievers"]
authority_bm25 = "dualarrow_example_plugin:create_authority_retriever"

[tool.setuptools.packages.find]
include = ["dualarrow_example_plugin*"]
